<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minuta · Legales</title>
<link rel="icon" href="/brand/minuta-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;600;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{--surface:#FBF6EE;--raised:#fff;--mantel:#F4E7D3;--ink:#231C19;--mute:#6E625A;--line:#E6DACA;--tinto:#8E1B2C;--sifon:#1F6B5C;--error:#B54708;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#1B1715;--raised:#26201D;--mantel:#3A2F27;--ink:#F6EEE4;--mute:#B9AC9E;--line:#3D342E;--tinto:#E06A78;--sifon:#6CC3AE;--error:#FF9F6B;color-scheme:dark}}
:root[data-theme="dark"]{--surface:#1B1715;--raised:#26201D;--mantel:#3A2F27;--ink:#F6EEE4;--mute:#B9AC9E;--line:#3D342E;--tinto:#E06A78;--sifon:#6CC3AE;--error:#FF9F6B;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.65 "Figtree",system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:0 16px}
nav{border-bottom:1px solid var(--line);background:var(--surface)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
nav img{height:30px}
nav .tabs{display:flex;gap:16px;font-weight:600;font-size:14px}
nav .tabs a{text-decoration:none;color:var(--mute)}nav .tabs a[aria-current=page]{color:var(--tinto)}
@media (max-width:560px){nav .tabs{display:none}}
h1{font:400 clamp(34px,6vw,46px)/1.1 "DM Serif Display",Georgia,serif;margin:40px 0 6px}
h2{font:400 24px/1.2 "DM Serif Display",Georgia,serif;margin:30px 0 6px}
p,li{color:var(--ink)}
.mute{color:var(--mute)}
.aviso{background:var(--mantel);border:1px dashed var(--ink);border-radius:10px;padding:12px 14px;font-size:14px;margin:18px 0}
a{color:var(--tinto)}
form{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:14px;margin:20px 0 60px}
label{display:block;font-weight:600;font-size:14px}
input,textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipos label{border:1.5px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;font-weight:700}
.tipos label:has(input:checked){border-color:var(--tinto);background:var(--mantel)}
.tipos small{display:block;font-weight:400;color:var(--mute)}
.tipos input{accent-color:var(--tinto);margin-right:6px}
@media (max-width:520px){.tipos{grid-template-columns:1fr}}
.btn{background:var(--tinto);color:#fff;border:0;border-radius:10px;padding:14px 20px;font:700 15px "Figtree",sans-serif;cursor:pointer}
.btn:disabled{opacity:.55}
.err{color:var(--error);font-weight:700;margin:0;min-height:1.3em}
.cod{background:var(--raised);border:2px solid var(--sifon);border-radius:10px;padding:26px;text-align:center;margin:20px 0 60px}
.cod b{display:block;font:600 34px "IBM Plex Mono",monospace;letter-spacing:.06em;margin:8px 0}
.hp{position:absolute;left:-9999px}
@media (max-width:720px){input,textarea{font-size:16px!important}form{padding:18px}}
footer{border-top:1px solid var(--line);padding:24px 0 40px;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<nav><div class="w"><a href="/inicio"><img src="/brand/minuta-lockup.svg" alt="Minuta"></a><div class="tabs"><a href="/terminos" data-p="terminos">Términos</a><a href="/privacidad" data-p="privacidad">Privacidad</a><a href="/arrepentimiento" data-p="arrepentimiento">Arrepentimiento y baja</a></div></div></nav>
<main class="w" id="main"></main>
<footer><div class="w" id="pie"></div></footer>
<script src="/legal.js"></script>
</body>
</html>
