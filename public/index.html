/* Tienda: encabezado amarillo mostaza, fondo papel, rojo ketchup para las acciones.

:root{--bg:#FCFBF8;--surf:#fff;--ink:#2A1608;--mute:#6f5a49;--line:#d9cdbf;--red:#C8261A;--onred:#fff;--hero:#F6B800;--heroink:#2A1608;--ok:#1f7a3d;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B120C;--surf:#281A11;--ink:#F7EBDD;--mute:#c2ad99;--line:#4a3626;--red:#FF5A44;--onred:#1B120C;--ok:#4cc77a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B120C;--surf:#281A11;--ink:#F7EBDD;--mute:#c2ad99;--line:#4a3626;--red:#FF5A44;--onred:#1B120C;--ok:#4cc77a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--hero);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans",system-ui,sans-serif;padding-bottom:96px;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header{background:var(--hero);color:var(--heroink);padding:36px 0 30px}

.pill{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:700;font-size:14px;background:var(--heroink);color:var(--hero)}
.pill.closed{background:#fff;color:#C8261A}
h2{font:400 26px/1.1 "Bowlby One","Arial Black",sans-serif;margin:34px 0 6px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border-bottom:1px dashed var(--line)}
.item.off{opacity:.45}
.nm{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:18px}
.nm i{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.ds{grid-column:1;color:var(--mute);font-size:15px;margin:0;min-width:0}
.item button{grid-row:1/3;grid-column:2;align-self:end}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--red);color:var(--onred);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{display:block;width:100%;padding:14px;font-size:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1.5px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:none;z-index:5}
#bar .btn{width:100%;max-width:684px;display:block;margin:0 auto;padding:14px;font-size:17px}
dialog{border:0;border-radius:16px;background:var(--surf);color:var(--ink);width:min(560px,calc(100% - 20px));max-height:calc(100% - 20px);padding:0}
dialog::backdrop{background:rgba(20,10,4,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surf);z-index:1}
.dh h3{margin:0;font-size:20px}
.db{padding:6px 18px 18px}
fieldset{border:0;padding:0;margin:14px 0 0;min-width:0}
legend{font-weight:700;margin-bottom:6px;padding:0}
label.o{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
label.o span:first-child{display:flex;gap:10px;align-items:center}
input[type=radio],input[type=checkbox]{accent-color:var(--red);width:19px;height:19px;flex:none}
.f{display:block;margin-top:12px;font-weight:500;font-size:15px}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.ci{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ci small{color:var(--mute);grid-column:1}
.q{display:flex;align-items:center;gap:8px;grid-row:1/3;grid-column:2}
.q button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
.tot{display:flex;justify-content:space-between;padding:4px 0}
.tot.big{font-weight:700;font-size:20px;border-top:2px solid var(--ink);margin-top:8px;padding-top:10px}
.err{color:var(--red);font-weight:700;margin:10px 0 0;min-height:1.2em}
.note{color:var(--mute);font-size:14px;margin-top:8px}
.banner{background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0;font-size:15px}
footer{padding:30px 0;color:var(--mute);font-size:14px}
/* Panel de administración */
.adm{padding-bottom:90px}
.adm input:not([type=checkbox]),.adm textarea,.adm select{display:block;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.adm h4{margin:24px 0 8px;font-size:18px}
.ar{display:grid;gap:8px;padding:14px 0;border-bottom:1px dashed var(--line)}
.ar label{display:flex;gap:8px;align-items:center}
.ar label.f{display:block;margin-top:0}
.ad{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-top:8px}
.ad2{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.ah{background:var(--hero);color:var(--heroink);padding:16px 0}
.ahr{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:20px;font-weight:700}
.tabs{display:flex;gap:6px;margin:16px 0 4px;overflow-x:auto}
.tabs button{flex:1;padding:10px 8px;border:1.5px solid var(--line);background:transparent;border-radius:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{margin-top:22px}
.it{border-bottom:1px dashed var(--line);padding:6px 0}
.it summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-weight:700;padding:8px 0}
.mini{display:flex;gap:6px}
.mini .btn{padding:8px 12px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}
.days{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0}
.hrs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oc{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--surf)}
.oc.new{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.oc.mute{opacity:.6}
.oc p{margin:4px 0}
.oc ul{margin:6px 0;padding-left:18px}
.oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--ink)}
.badge.ok{background:var(--ok);color:#fff}
.badge.warn{background:var(--hero);color:var(--heroink)}
.badge.bad{background:var(--red);color:var(--onred)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1.5px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:6}

@media (prefers-reduced-motion:no-preference){.btn:active{transform:scale(.97)}}
#logo{display:block;width:88px;height:88px;object-fit:contain;border-radius:20px;background:#fff;padding:6px;margin:0 0 14px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.steps{list-style:none;margin:14px 0 4px;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;padding:9px 0;color:var(--mute);position:relative}
.steps li i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 13px/1 system-ui;font-style:normal;background:var(--surf)}
.steps li.done{color:var(--ink)}.steps li.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.now{color:var(--ink);font-weight:700}.steps li.now i{background:var(--red);border-color:var(--red);color:var(--onred);animation:pulso 1.6s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(200,38,26,.35)}70%{box-shadow:0 0 0 9px rgba(200,38,26,0)}100%{box-shadow:0 0 0 0 rgba(200,38,26,0)}}
@media (prefers-reduced-motion:reduce){.steps li.now i{animation:none}}
#miPedido{margin-top:14px}
.stat{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf);margin:0 0 8px}
.stat.on{border-color:var(--ok)}.stat b{display:block;font-size:17px}.stat small{color:var(--mute)}
.lnk{margin:6px 2px 14px;font-size:14px;color:var(--mute)}.lnk a{color:var(--ink)}
.lk{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px}
.guide{border:1.5px dashed var(--line);border-radius:14px;padding:14px 16px;margin:6px 0 16px;background:var(--surf)}
.guide ol{list-style:none;margin:10px 0 8px;padding:0;display:grid;gap:6px}
.guide li{display:flex;gap:10px;align-items:center;justify-content:space-between}
.guide li.ok span{color:var(--mute);text-decoration:line-through}.guide li i{color:var(--ok);font-style:normal;font-weight:700}
.guide .btn{padding:6px 12px;font-size:14px}
.btn.wa{background:#1f9d55;color:#fff}
.prev{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;font-size:20px;margin:6px 0 12px}
.prev img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:12px;padding:3px}
.prev span{margin-left:auto;padding:7px 14px;border-radius:10px;font-size:14px;font-weight:700}
.logorow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lg{width:72px;height:72px;object-fit:contain;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:4px}
.lg.empty{display:grid;place-items:center;color:var(--mute);font-size:12px;background:var(--surf)}
.filebtn{cursor:pointer}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.swb{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1.5px var(--line)}
.swb.on{border-color:var(--bg);box-shadow:0 0 0 3px var(--ink)}
.swb.custom{background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);position:relative;overflow:hidden}
.swb.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.help{display:block;color:var(--mute);font-size:13px;margin-top:4px}
h4.first{margin-top:6px}
.tkbig{font:400 24px/1.15 "Bowlby One","Arial Black",sans-serif;margin:0 0 4px}

</head>

<div id="tienda">

</div>

<fieldset><legend>¿Cómo lo recibís?</legend>
<label class="o"><span><input type="radio" name="modo" value="retiro" checked> Retiro en el local</span><span>Sin costo</span></label>

<label class="f" for="cNom">Nombre<input id="cNom" autocomplete="name" maxlength="60"></label>
<label class="f" for="cTel">Tu WhatsApp (con código de área, sin 0 ni 15)<input id="cTel" placeholder="1155551234" type="tel" autocomplete="tel" inputmode="tel" maxlength="30"></label>
<div id="dirBox" hidden>
<label class="f" for="cZona">Barrio<select id="cZona"></select></label>
<label class="f" for="cDir">Dirección (calle, número, piso/depto)<input id="cDir" autocomplete="street-address" maxlength="120"></label></div>
<fieldset><legend>Forma de pago</legend>
<label class="o"><span><input type="radio" name="pago" value="efectivo" checked> Efectivo</span></label>
<label class="o"><span><input type="radio" name="pago" value="transferencia"> Transferencia</span></label></fieldset>
<label class="f" id="cambioBox" for="cCambio">Si pagás en efectivo, ¿con cuánto abonás?<input id="cCambio" inputmode="numeric" placeholder="Opcional" maxlength="20"></label>
<p class="note" id="tNota" hidden></p>
<label class="f" for="cNota">Notas para el local<textarea id="cNota" rows="2" maxlength="200"></textarea></label>
<div style="margin-top:16px"><div class="tot"><span>Subtotal</span><span id="tSub"></span></div>
<div class="tot"><span>Envío</span><span id="tEnv"></span></div>
<div class="tot big"><span>Total</span><span id="tTot"></span></div></div>
<p class="err" id="err" role="alert"></p>
<button class="btn block" id="enviar"></button>
<p class="note" id="pieEnviar"></p></div></dialog>

<dialog id="dTrack"><div class="dh"><h3 id="tkNum">Tu pedido</h3><button class="btn ghost" data-close aria-label="Cerrar">Cerrar</button></div>
<div class="db"><p class="tkbig" id="tkTit"></p><p class="note" id="tkTxt" style="margin-top:4px"></p><ol class="steps" id="tkSteps"></ol><div id="tkAcc" style="display:grid;gap:10px;margin-top:12px"></div></div></dialog>

<dialog id="dOk"><div class="dh"><h3 id="okTit"></h3></div>
<div class="db"><p id="okTxt"></p><div id="okAcc" style="display:grid;gap:10px;margin-top:14px"></div></div></dialog>

<div id="admin" class="adm" hidden>
<header class="ah"><div class="wrap ahr"><span id="aTitulo">Panel del local</span><button class="btn ghost" id="aSalir" hidden>Salir</button></div></header>
<div class="wrap" id="aLogin">
<h2>Entrar al panel</h2>
<label class="f" for="aEmail">Email<input type="email" id="aEmail" autocomplete="username"></label>
<label class="f" for="aPass">Contraseña<input type="password" id="aPass" autocomplete="current-password"></label>
<p class="err" id="aErr" role="alert"></p>
<button class="btn" id="aEntrar">Entrar</button>
</div>
<div class="wrap" id="aApp" hidden>
<nav class="tabs" id="aTabs">
<button data-tab="pedidos" aria-selected="true">Pedidos</button>
<button data-tab="menu" aria-selected="false">Menú</button>
<button data-tab="local" aria-selected="false">Mi local</button>
<button data-tab="cuenta" aria-selected="false">Cuenta</button>
</nav>
<section id="t-pedidos"></section>
<section id="t-menu" hidden></section>
<section id="t-local" hidden></section>
<section id="t-cuenta" hidden></section>
</div>
<div class="savebar" id="aSave" hidden><span id="aMsg" role="status"></span><button class="btn" id="aGuardar" disabled>Guardar cambios</button></div>
</div>

/* ---------- Horario (hora de Argentina, igual que el servidor) ---------- */
function nowAR(d){
  var parts=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(d||new Date());
  var g=function(t){return parts.filter(function(p){return p.type===t})[0].value};
  return {dow:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[g('weekday')],h:Number(g('hour'))+Number(g('minute'))/60};
}
function isOpen(cfg){
  if(cfg.pausado)return false;
  var hr=cfg.horario,n=nowAR();
  if(hr.desde<hr.hasta)return hr.dias.indexOf(n.dow)>-1&&n.h>=hr.desde&&n.h<hr.hasta;
  return (hr.dias.indexOf(n.dow)>-1&&n.h>=hr.desde)||(hr.dias.indexOf((n.dow+6)%7)>-1&&n.h<hr.hasta);
}
function diasTxt(dias){return dias.slice().sort(function(a,b){return ((a+6)%7)-((b+6)%7)}).map(function(x){return DIAS[x].slice(0,3)}).join(', ')}

/* ---------- Estado de la tienda ---------- */
var S={cfg:null,api:false,abierto:true,cart:[],suspendido:false};
var apiMode=function(){return S.api};
var LOCAL=(new URLSearchParams(location.search).get('local')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
function apiUrl(path){if(!LOCAL)return path;return path+(path.indexOf('?')>-1?'&':'?')+'local='+encodeURIComponent(LOCAL)}
var isAdminRoute=location.pathname.replace(/\/+$/,'')==='/admin'||location.hash==='#admin';

async function cargarConfig(fresh){
  try{
    var r=await fetch(apiUrl('/api/menu'+(fresh?'?fresh=1':'')),{headers:{accept:'application/json'}});
    if(r.status===404){var j0=await r.json().catch(function(){return null});if(j0&&j0.error==='local_no_encontrado')return 'nolocal'}
    if(r.ok){
      var j=await r.json();
      if(j&&j.landing)return 'landing';
      if(j&&j.config&&Array.isArray(j.config.menu)){
        S.cfg=j.config;S.api=!!j.storage;S.abierto=!!j.abierto;S.suspendido=!!j.suspendido;S.storage=!!j.storage;S.hasApi=true;
        return 'ok';
      }
    }else if(r.status>=500)return 'error';
  }catch(e){}
  /* Sin servidor (vista previa): menú de ejemplo y pedidos solo por WhatsApp. */
  S.cfg=clone(DEFAULT_CONFIG);S.api=false;S.suspendido=false;S.abierto=isOpen(S.cfg);S.hasApi=false;
  return 'demo';
}

function renderEstado(){
  var c=S.cfg,h=c.horario,el=$('#estado');
  el.className='pill'+(S.abierto?'':' closed');
  el.textContent=S.suspendido?'Este local no está tomando pedidos por ahora':S.abierto?'Abierto hasta las '+pad(h.hasta%24):(c.pausado?'Por ahora no tomamos pedidos':'Cerrado ahora: abrimos desde las '+pad(h.desde)+' ('+diasTxt(h.dias)+')');
}

function renderMenu(){
  var c=S.cfg,html='';
  c.categorias.forEach(function(cat){
    var items=c.menu.filter(function(p){return p.cat===cat.id});
    if(!items.length)return;
    html+='<h2>'+esc(cat.nom)+'</h2>';
    items.forEach(function(p){
      html+='<div class="item'+(p.off?' off':'')+'"><div class="nm"><span>'+esc(p.nom)+'</span><i></i><span>'+money(p.precio)+'</span></div><p class="ds">'+esc(p.desc)+'</p>'+
      (p.off?'<button class="btn ghost" disabled>Agotado</button>':'<button class="btn" data-add="'+esc(p.id)+'">Agregar</button>')+'</div>';
    });
  });
  $('#menu').innerHTML=html;
}

function aplicarMarca(c){
  var col=/^#[0-9a-fA-F]{6}$/.test(c.color||'')?c.color:'#c2410c',n=parseInt(col.slice(1),16);
  var r=n>>16&255,g=n>>8&255,b=n&255,lum=(0.299*r+0.587*g+0.114*b)/255,on=lum>0.6?'#1d1208':'#ffffff';
  var st=document.documentElement.style;
  st.setProperty('--hero',col);st.setProperty('--heroink',on);st.setProperty('--red',col);st.setProperty('--onred',on);
  var lg=$('#logo');if(lg){if(c.logo){lg.src=c.logo;lg.hidden=false}else{lg.hidden=true;lg.removeAttribute('src')}}
}
function pintarTienda(){
  var c=S.cfg;aplicarMarca(c);
  $('#nombre').textContent=c.nombre;
  $('#desc').textContent=c.descripcion||'';
  document.title=c.nombre;
  $('#pie').textContent=apiMode()?'Tu pedido le llega al local al instante. Vas a poder ver cómo avanza.':'Tu pedido se envía por WhatsApp al local y ellos te lo confirman con el tiempo de espera.';

  $('#cZona').innerHTML=c.zonas.map(function(z){return '<option value="'+esc(z.id)+'">'+esc(z.nom)+' (+'+money(z.costo)+')</option>'}).join('');
  if(zsel&&c.zonas.some(function(z){return z.id===zsel}))$('#cZona').value=zsel;
  $('#oDel').hidden=!c.zonas.length;
  if(!c.zonas.length)$('input[name=modo][value=retiro]').checked=true;
  renderEstado();renderMenu();normalizeCart();renderCart();

/* Mantiene al día si el local está abierto, sin molestar si el cliente está armando el pedido. */
async function refrescar(){
  if($('#dPed').open||$('#dProd').open||$('#dOk').open||$('#dTrack').open||document.visibilityState!=='visible')return;
  if(S.hasApi){if((await cargarConfig(false))==='ok')pintarTienda()}
  else{S.abierto=isOpen(S.cfg);renderEstado();renderCart()}
}

/* ---------- Carrito ---------- */
var prod=function(id){return S.cfg.menu.filter(function(p){return p.id===id})[0]};
var extraById=function(id){return S.cfg.extras.filter(function(x){return x.id===id})[0]};
function saveCart(){store.set('cart2',JSON.stringify(S.cart))}
function loadCart(){try{var c=JSON.parse(store.get('cart2')||'[]');return Array.isArray(c)?c:[]}catch(e){return[]}}

/* Cada línea se calcula con los precios actuales del menú. */
function lines(){
  return S.cart.map(function(i,idx){
    var p=prod(i.pid);if(!p||p.off)return null;
    var unit=p.precio,names=[];
    for(var k=0;k<i.ex.length;k++){var x=extraById(i.ex[k]);if(!x)return null;unit+=x.precio;names.push(x.nom)}
    return {i:i,idx:idx,p:p,unit:unit,names:names};
  }).filter(Boolean);
}
function normalizeCart(){
  var ok=lines().map(function(l){return l.i});
  var removed=S.cart.length-ok.length;
  if(removed>0){S.cart=ok;saveCart();var n=$('#cNotaCarrito');n.textContent='Quitamos de tu pedido algunos productos que ya no están disponibles.';n.hidden=false}
}
function addItem(pid,ex,nota){
  ex=ex.slice().sort();
  var f=S.cart.filter(function(i){return i.pid===pid&&i.ex.join()===ex.join()&&i.nota===nota})[0];
  if(f)f.qty++;else S.cart.push({pid:pid,ex:ex,nota:nota,qty:1});
  saveCart();renderCart();
}
function sub(){return lines().reduce(function(s,l){return s+l.unit*l.i.qty},0)}
function modo(){return $('input[name=modo]:checked').value}
function zonaSel(){return S.cfg.zonas.filter(function(z){return z.id===$('#cZona').value})[0]}
function envio(){if(modo()!=='delivery')return 0;var z=zonaSel();return z?z.costo:0}
function pago(){return $('input[name=pago]:checked').value}

function renderCart(){
  var ls=lines(),n=ls.reduce(function(s,l){return s+l.i.qty},0);
  $('#bar').style.display=n?'block':'none';
  $('#verPedido').textContent='Ver pedido ('+n+') · '+money(sub());
  $('#lista').innerHTML=ls.length?ls.map(function(l){
    var det=[];if(l.names.length)det.push('Extras: '+l.names.join(', '));if(l.i.nota)det.push('Nota: '+l.i.nota);
    return '<div class="ci"><b>'+esc(l.p.nom)+'</b><div class="q"><button data-m="'+l.idx+'" aria-label="Quitar uno">−</button><span>'+l.i.qty+'</span><button data-p="'+l.idx+'" aria-label="Sumar uno">+</button></div><small>'+esc(det.join(' · '))+(det.length?' · ':'')+money(l.unit*l.i.qty)+'</small></div>';
  }).join(''):'<p class="note">Todavía no agregaste nada. Elegí algo del menú.</p>';
  $('#dirBox').hidden=modo()!=='delivery';
  $('#cambioBox').hidden=pago()!=='efectivo';
  var tn=$('#tNota');
  if(pago()==='transferencia'){tn.hidden=false;tn.textContent=apiMode()?'Cuando el local reciba tu pedido te escribe por WhatsApp con el alias para que transfieras. Ahí mismo le mandás el comprobante.':(S.cfg.alias?'Alias para transferir: '+S.cfg.alias+'. Mandanos el comprobante por WhatsApp.':'Te pasamos el alias por WhatsApp para que transfieras.')}else tn.hidden=true;
  var t=sub()+envio();
  $('#tSub').textContent=money(sub());$('#tEnv').textContent=envio()?money(envio()):'—';$('#tTot').textContent=money(t);
  var b=$('#enviar'),cerrado=apiMode()&&!S.abierto;
  b.disabled=cerrado||!ls.length;
  b.textContent=cerrado?'El local está cerrado':apiMode()?'Confirmar pedido · '+money(t):'Enviar pedido por WhatsApp';
  $('#pieEnviar').textContent=apiMode()?'El local recibe tu pedido al instante y te avisa por WhatsApp. Acá vas a ver cómo avanza.':'Al tocar el botón se abre WhatsApp con tu pedido ya escrito. Solo falta enviarlo.';
}

/* ---------- Producto con extras ---------- */

$$('[data-close]').forEach(function(b){b.addEventListener('click',function(){b.closest('dialog').close()})});

$('#lista').addEventListener('click',function(e){

$('#verPedido').addEventListener('click',function(){$('#err').textContent='';$('#dPed').showModal()});
$('#dPed').addEventListener('change',renderCart);

/* ---------- Pantalla de confirmación ---------- */
function showOk(titulo,texto,botones){
  $('#okTit').textContent=titulo;$('#okTxt').textContent=texto;
  $('#okAcc').innerHTML=botones.map(function(b,i){
    var cls='btn block'+(b.ghost?' ghost':'');
    return b.href?'<a class="'+cls+'" href="'+esc(b.href)+'" target="_blank" rel="noopener">'+esc(b.txt)+'</a>':'<button class="'+cls+'" data-ok="'+i+'">'+esc(b.txt)+'</button>';
  }).join('');
  $$('#okAcc [data-ok]').forEach(function(el){el.onclick=function(){botones[+el.getAttribute('data-ok')].fn()}});
  if(!$('#dOk').open)$('#dOk').showModal();
}
var cerrarOk=function(){$('#dOk').close()};
$('#dOk').addEventListener('cancel',function(e){if($('#okTit').textContent.indexOf('Confirmando')===0)e.preventDefault()});

function waUrl(texto){return 'https://wa.me/'+S.cfg.whatsapp+'?text='+encodeURIComponent(texto)}

function mensaje(numero,pagoTxt){
  var L=['*Pedido nuevo'+(numero?' #'+numero:'')+' – '+S.cfg.nombre+'*',''];
  lines().forEach(function(l){
    L.push(l.i.qty+'x '+l.p.nom+' – '+money(l.unit*l.i.qty));
    var det=[];if(l.names.length)det.push('Extras: '+l.names.join(', '));if(l.i.nota)det.push('Nota: '+l.i.nota);
    if(det.length)L.push('   '+det.join(' · '));
  });
  var z=zonaSel(),d=modo()==='delivery';
  L.push('','Subtotal: '+money(sub()));
  if(d)L.push('Envío ('+z.nom+'): '+money(envio()));
  L.push('*Total: '+money(sub()+envio())+'*','');
  L.push(d?'Entrega: delivery a '+$('#cDir').value.trim()+', '+z.nom:'Entrega: retiro en el local');
  L.push('Nombre: '+$('#cNom').value.trim(),'Teléfono: '+$('#cTel').value.trim(),'Pago: '+pagoTxt);
  if(pago()==='efectivo'&&$('#cCambio').value.trim())L.push('Abona con: $'+$('#cCambio').value.trim());
  if($('#cNota').value.trim())L.push('Notas: '+$('#cNota').value.trim());
  if(!apiMode()&&!S.abierto)L.push('','(Pedido enviado con el local cerrado, para cuando abran)');
  return L.join('\n');
}

function vaciar(){S.cart=[];saveCart();renderCart()}

/* ---------- Enviar el pedido ---------- */
$('#enviar').addEventListener('click',async function(){
  var d=modo()==='delivery',err='',ls=lines();
  if(!ls.length)err='Agregá al menos un producto.';
  else if($('#cNom').value.trim().length<2)err='Escribí tu nombre.';
  else if($('#cTel').value.replace(/\D/g,'').length<8)err='Escribí un teléfono válido para avisarte.';
  else if(d&&!$('#cDir').value.trim())err='Escribí la dirección de entrega.';
  $('#err').textContent=err;if(err)return;
  var P=pago(),pagoTxt={efectivo:'Efectivo',transferencia:'Transferencia'}[P];

  if(!apiMode()){
    var a=document.createElement('a');
    a.href=waUrl(mensaje(0,pagoTxt));a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    vaciar();$('#dPed').close();return;
  }

  var b=$('#enviar');b.disabled=true;b.textContent='Enviando…';
  var payload={
    items:ls.map(function(l){return {id:l.i.pid,qty:l.i.qty,extras:l.i.ex,nota:l.i.nota}}),
    modo:modo(),zona:d?$('#cZona').value:'',dir:d?$('#cDir').value.trim():'',
    cliente:{nombre:$('#cNom').value.trim(),tel:$('#cTel').value.trim()},
    pago:P,cambio:$('#cCambio').value.trim(),nota:$('#cNota').value.trim()
  };
  var data=null;
  try{
    var r=await fetch(apiUrl('/api/checkout'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
    data=await r.json().catch(function(){return null});
    if(!r.ok||!data||!data.ok){
      $('#err').textContent=(data&&data.mensaje)||'No pudimos enviar el pedido. Probá de nuevo.';
      if(r.status===409||(data&&/actualiz/i.test(data.mensaje||''))){await cargarConfig(true);pintarTienda()}
      renderCart();return;
    }
  }catch(e){$('#err').textContent='No pudimos conectar. Revisá tu internet y probá de nuevo.';renderCart();return}

  store.set('track',JSON.stringify({id:data.id,numero:data.numero}));
  vaciar();$('#dPed').close();
  abrirSeguimiento(data.id,data.numero,true);
});

/* ---------- Seguimiento del pedido ---------- */
var TK={id:null,numero:0,timer:null,last:null};
var FINAL={entregado:1,cancelado:1};
function pasosDe(modo){
  var p=[['nuevo','Recibimos tu pedido'],['preparando','Lo estamos preparando'],['listo',modo==='delivery'?'Listo, sale en un momento':'Listo para retirar']];
  if(modo==='delivery')p.push(['en_camino','Va en camino']);
  p.push(['entregado','Entregado']);
  return p;
}
function pintarSeguimiento(o,primera){
  var pasos=pasosDe(o.modo),ix=pasos.map(function(x){return x[0]}).indexOf(o.estado);
  $('#tkNum').textContent='Pedido #'+o.numero;
  var tit={nuevo:'Pedido recibido',preparando:'Lo estamos preparando',listo:o.modo==='delivery'?'Ya está listo':'Ya podés retirarlo',en_camino:'Va en camino',entregado:'Entregado. ¡Buen provecho!',cancelado:'El local canceló el pedido'}[o.estado]||'Pedido recibido';
  $('#tkTit').textContent=tit;
  var tx='Esta pantalla se actualiza sola.';
  if(o.estado==='nuevo'&&o.pago.metodo==='transferencia')tx='El local te va a escribir por WhatsApp con el alias para transferir. Ahí mismo le mandás el comprobante.';
  else if(o.estado==='nuevo')tx='El local ya lo tiene y te escribe por WhatsApp para confirmarte el pedido. Pagás en efectivo al recibirlo.';
  else if(o.estado==='cancelado')tx='Escribile al local por WhatsApp para saber qué pasó.';
  else if(o.pago.metodo==='transferencia'&&!o.pago.pagado&&!FINAL[o.estado])tx='Acordate de transferir y mandar el comprobante por WhatsApp. Esta pantalla se actualiza sola.';
  $('#tkTxt').textContent=tx;
  $('#tkSteps').innerHTML=o.estado==='cancelado'?'':pasos.map(function(p,i){
    var cls=i<ix?'done':i===ix?(FINAL[o.estado]?'done':'now'):'';
    return '<li class="'+cls+'"><i>'+(cls==='done'?'✓':(i+1))+'</i><span>'+esc(p[1])+'</span></li>';
  }).join('');
  var acc='<a class="btn block ghost" target="_blank" rel="noopener" href="'+esc(waUrl('Hola! Te escribo por mi pedido #'+o.numero+'.'))+'">Escribir al local por WhatsApp</a>';
  if(FINAL[o.estado])acc+='<button class="btn block" id="tkNuevo">Hacer otro pedido</button>';
  $('#tkAcc').innerHTML=acc;
  var nb=$('#tkNuevo');if(nb)nb.onclick=function(){store.del('track');$('#dTrack').close();pintarChip(null)};
  if(TK.last&&TK.last!==o.estado&&!primera&&!FINAL[o.estado]){try{if(navigator.vibrate)navigator.vibrate(120)}catch(e){}}
  TK.last=o.estado;
}
async function pedirEstado(id){
  var r=await fetch(apiUrl('/api/order?id='+encodeURIComponent(id)));
  if(r.status===404)return 'gone';
  if(!r.ok)return null;
  return r.json();
}
async function abrirSeguimiento(id,numero,primera){
  TK.id=id;TK.numero=numero||0;TK.last=null;
  clearInterval(TK.timer);
  var o=null;try{o=await pedirEstado(id)}catch(e){}
  if(o==='gone'){store.del('track');pintarChip(null);showOk('No encontramos ese pedido','Puede que el link esté vencido. Escribile al local por WhatsApp.',[{txt:'Escribir al local',href:waUrl('Hola! Quiero consultar por un pedido.')},{txt:'Cerrar',ghost:true,fn:cerrarOk}]);return}
  if(!o){$('#tkNum').textContent='Tu pedido';$('#tkTit').textContent='No pudimos ver el estado';$('#tkTxt').textContent='Revisá tu internet y probá de nuevo.';$('#tkSteps').innerHTML='';$('#tkAcc').innerHTML='<button class="btn block" id="tkRe">Reintentar</button>';$('#tkRe').onclick=function(){abrirSeguimiento(id,numero)}}
  else{pintarSeguimiento(o,primera);pintarChip(o)}
  if(!$('#dTrack').open)$('#dTrack').showModal();
  TK.timer=setInterval(async function(){
    if(!$('#dTrack').open){clearInterval(TK.timer);return}
    try{var x=await pedirEstado(TK.id);if(x&&x!=='gone'){pintarSeguimiento(x);pintarChip(x);if(FINAL[x.estado])clearInterval(TK.timer)}}catch(e){}
  },8000);
}
function pintarChip(o){
  var b=$('#miPedido');
  if(!o||FINAL[o.estado]){b.hidden=true;return}
  b.hidden=false;b.textContent='Ver mi pedido #'+o.numero+' · '+({nuevo:'recibido',preparando:'preparando',listo:'listo',en_camino:'en camino'}[o.estado]||'');
}
$('#miPedido').addEventListener('click',function(){var t=null;try{t=JSON.parse(store.get('track')||'null')}catch(e){}if(t)abrirSeguimiento(t.id,t.numero)});
async function revisarPedidoGuardado(){
  var t=null;try{t=JSON.parse(store.get('track')||'null')}catch(e){}
  if(!t||!apiMode())return;
  try{var o=await pedirEstado(t.id);if(o==='gone'||(o&&FINAL[o.estado])){store.del('track');pintarChip(null)}else if(o)pintarChip(o)}catch(e){}
}

/* ---------- Panel de administración ---------- */
var A={tok:'',draft:null,cuenta:null,dirty:false,orders:[],seen:null,fresh:{},tab:'pedidos',ctx:null,timer:null,open:{},storage:true,estado:'activo',venceEl:null};
var uid=function(p){return p+Math.random().toString(36).slice(2,8)};
function aFetch(path,opt){
  opt=opt||{};opt.headers=Object.assign({authorization:'Bearer '+A.tok},opt.headers||{});
  return fetch(apiUrl(path),opt).then(function(r){if(r.status===401&&A.tok&&!A.loggingIn)aExpire();return r});

function aExpire(){A.tok='';store.del('tok');clearInterval(A.timer);aShowLogin('Tu sesión venció. Entrá de nuevo.')}
function aShowLogin(m){$('#aApp').hidden=true;$('#aSave').hidden=true;$('#aSalir').hidden=true;$('#aLogin').hidden=false;aErr(m||'')}

async function aLogin(){
  var email=$('#aEmail').value.trim(),pw=$('#aPass').value;
  if(!email||!pw){aErr('Escribí tu email y tu contraseña.');return}
  try{A.ctx=A.ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}

function hora(iso){
  var d=new Date(iso),o={timeZone:TZ};
  var t=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',timeZone:TZ});
  var hoy=new Date().toLocaleDateString('es-AR',o)===d.toLocaleDateString('es-AR',o);
  return hoy?t:d.toLocaleDateString('es-AR',{day:'numeric',month:'numeric',timeZone:TZ})+' '+t;
}
var ESTADO_TXT={nuevo:'Nuevo',preparando:'Preparando',listo:'Listo',en_camino:'En camino',entregado:'Entregado',cancelado:'Cancelado'};
function siguiente(o){
  var d=o.entrega.modo==='delivery';
  return {nuevo:[['preparando','Empezar a preparar']],preparando:[['listo','Marcar listo']],listo:d?[['en_camino','Sale en camino']]:[['entregado','Marcar entregado']],en_camino:[['entregado','Marcar entregado']]}[o.estado]||[];

function pagoBadge(o){
  if(o.pago.metodo==='efectivo')return ['Efectivo'+(o.pago.cambio?' (abona con $'+o.pago.cambio+')':''),''];
  return o.pago.pagado?['Transferencia recibida','ok']:['Transferencia pendiente','warn'];
}
/* Teléfono argentino → número de WhatsApp (549 + área + número, sin 0 ni 15). */
function waNum(tel){
  var d=String(tel).replace(/\D/g,'').replace(/^00/,'');
  if(d.indexOf('549')===0)return d;
  if(d.indexOf('54')===0)d=d.slice(2);
  d=d.replace(/^0/,'');
  if(d.length>10){for(var i=2;i<=4;i++){if(d.substr(i,2)==='15'&&d.length-2===10){d=d.slice(0,i)+d.slice(i+2);break}}}
  return d.length===10?'549'+d:d;
}
function trackUrl(id){return location.origin+'/?pedido='+id+(LOCAL?'&local='+encodeURIComponent(LOCAL):'')}
function storeUrl(){return location.origin+'/'+(LOCAL?'?local='+encodeURIComponent(LOCAL):'')}
function waCliente(o,texto){return 'https://wa.me/'+waNum(o.cliente.tel)+'?text='+encodeURIComponent(texto)}
function msgAlias(o){
  var c=S.cfg;
  return '¡Hola '+o.cliente.nombre+'! Recibimos tu pedido #'+o.numero+' en '+c.nombre+'.\nTotal: '+money(o.total)+'.\n\n'+
  'Para pagar por transferencia:\n*Alias: '+c.alias+'*\n\nCuando transfieras, mandanos el comprobante por este chat y lo preparamos.\n\nPodés seguir tu pedido acá: '+trackUrl(o.id);
}

  'Ya lo estamos tomando. Podés seguir tu pedido acá: '+trackUrl(o.id);

function beep(){
  try{
    var c=A.ctx;if(!c)return;if(c.state==='suspended')c.resume();
    var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
    o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.3);
  }catch(e){}
}
async function aPoll(){
  if(document.visibilityState!=='visible')return;
  try{
    var r=await aFetch('/api/orders');if(!r.ok)return;
    var j=await r.json();A.orders=j.orders;A.fresh={};A.estado=j.estado;

}

  if(p==='color'||p==='nombre'){var pv=$('#marcaPrev');if(pv)pv.outerHTML=marcaPreview();if(p==='color')$$('.swb[data-c]').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-c')===v)})}
  if(el.hasAttribute('data-re'))renderForm();
}
['input','change'].forEach(function(ev){$('#aApp').addEventListener(ev,function(e){if(A.tab==='menu'||A.tab==='local')onEdit(e)})});
$('#aApp').addEventListener('toggle',function(e){var t=e.target;if(t.classList&&t.classList.contains('it'))A.open[t.getAttribute('data-id')]=t.open?1:0},true);

/* Logo: se achica en el navegador para que pese poco. */
function procesarLogo(file){
  if(!file)return;
  if(!/^image\//.test(file.type)){aMsg('Elegí una imagen (PNG, JPG o WebP).');return}
  aMsg('Procesando el logo…');
  var fr=new FileReader();
  fr.onerror=function(){aMsg('No pudimos leer la imagen.')};
  fr.onload=function(){
    var im=new Image();
    im.onerror=function(){aMsg('No pudimos abrir esa imagen. Probá con un PNG o JPG.')};
    im.onload=function(){
      var out='',sizes=[256,192,128];
      for(var i=0;i<sizes.length&&!out;i++){
        var k=Math.min(1,sizes[i]/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
        var c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');x.drawImage(im,0,0,w,h);
        var u=c.toDataURL('image/png');
        if(u.length>140000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);u=c.toDataURL('image/jpeg',.85)}
        if(u.length<=140000)out=u;
      }
      if(!out){aMsg('Esa imagen es muy pesada. Probá con otra más simple.');return}
      A.draft.logo=out;markDirty();renderForm();
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function swap(arr,i,j){if(j<0||j>=arr.length)return false;var t=arr[i];arr[i]=arr[j];arr[j]=t;return true}
$('#aApp').addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a'),i=+b.getAttribute('data-i'),d=A.draft;
  var sure=function(){if(b.getAttribute('data-sure')!=='1'){b.setAttribute('data-sure','1');b.textContent='Tocá de nuevo para borrar';return false}return true};
  aMsg('');
  switch(a){
    case 'swatch':d.color=b.getAttribute('data-c');break;
    case 'nologo':d.logo='';break;
    case 'addc':d.categorias.push({id:uid('c'),nom:'Nueva categoría'});break;
    case 'delc':
      if(d.menu.some(function(p){return p.cat===d.categorias[i].id})){aMsg('Primero movés o borrás los productos de esa categoría.');return}
      if(d.categorias.length<2){aMsg('Tiene que quedar al menos una categoría.');return}
      if(!sure())return;d.categorias.splice(i,1);break;
    case 'cup':swap(d.categorias,i,i-1);break;
    case 'cdn':swap(d.categorias,i,i+1);break;
    case 'addp':var np={id:uid('p'),cat:b.getAttribute('data-c'),nom:'Nuevo producto',desc:'',precio:0,extras:false,off:false};d.menu.push(np);A.open[np.id]=1;break;
    case 'delp':if(!sure())return;d.menu.splice(i,1);break;
    case 'pup':case 'pdn':
      var dir=a==='pup'?-1:1,j=i+dir;
      while(j>=0&&j<d.menu.length&&d.menu[j].cat!==d.menu[i].cat)j+=dir;
      swap(d.menu,i,j);break;
    case 'adde':d.extras.push({id:uid('e'),nom:'Nuevo extra',precio:0});break;
    case 'dele':if(!sure())return;d.extras.splice(i,1);break;
    case 'addz':d.zonas.push({id:uid('z'),nom:'Nuevo barrio',costo:0});break;
    case 'delz':if(!sure())return;d.zonas.splice(i,1);break;
  }
  markDirty();renderForm();
});

$('#aGuardar').addEventListener('click',async function(){
  var b=this;b.disabled=true;aMsg('Guardando…');

    var r=await aFetch('/api/menu',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(A.draft)});
    var j=await r.json().catch(function(){return null});

      aMsg(m);b.disabled=false;

});

/* ----- Cuenta: plan y contraseña ----- */
function fechaTxt(iso){if(!iso)return 'sin fecha';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
async function renderCuenta(){
  var el=$('#t-cuenta');
  if(!A.cuenta){
    el.innerHTML='<p class="note">Cargando…</p>';
    try{var r=await aFetch('/api/account');A.cuenta=await r.json()}catch(e){el.innerHTML='<p class="note">No pudimos cargar tu cuenta.</p>';return}
  }
  var c=A.cuenta,E={activo:'Al día',vencido:'Vencida',suspendido:'Suspendido'};
  var h='<h4 class="first">Tu plan</h4><p><span class="badge'+(c.estado==='activo'?' ok':' bad')+'">'+esc(E[c.estado]||c.estado)+'</span> '+(c.venceEl?'Vence el '+esc(fechaTxt(c.venceEl)):'')+'</p><p class="note">Usuario: '+esc(c.email)+'</p>';
  h+='<h4>Cambiar contraseña</h4><label class="f" for="pwA">Contraseña actual<input id="pwA" type="password" autocomplete="current-password"></label>'+
  '<label class="f" for="pwN">Contraseña nueva (mínimo 8 caracteres)<input id="pwN" type="password" autocomplete="new-password"></label><div class="acts"><button class="btn" id="pwGuardar">Cambiar contraseña</button></div>'+
  '<p class="note" id="cuMsg" role="status"></p>';
  el.innerHTML=h;
}
$('#t-cuenta').addEventListener('click',async function(e){
  if(e.target.id!=='pwGuardar')return;
  var msg=function(m){var x=$('#cuMsg');if(x)x.textContent=m};
  try{
    var r=await aFetch('/api/account',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({accion:'clave',actual:$('#pwA').value,nueva:$('#pwN').value})});
    var j=await r.json().catch(function(){return null});
    if(!r.ok){msg((j&&j.mensaje)||'No pudimos cambiarla.');return}
    A.tok=j.token;store.set('tok',j.token);$('#pwA').value='';$('#pwN').value='';msg('Contraseña cambiada.');
  }catch(err){msg('No pudimos conectar. Probá de nuevo.')}
});

/* ---------- Arranque ---------- */
(async function init(){
  if(isAdminRoute){
    $('#tienda').hidden=true;$('#admin').hidden=false;document.title='Panel del local';
    var t0=store.get('tok');if(t0){A.tok=t0;aEnter()}
    return;
  }
  var st=await cargarConfig(false);
  if(st==='landing'){location.replace('/inicio');return}
  if(st==='nolocal'){
    document.title='Local no encontrado';
    $('#nombre').textContent='No encontramos este local';$('#desc').textContent='Revisá la dirección o escribile al local.';$('#estado').hidden=true;
    return;
  }
  if(st==='error'){
    $('#nombre').textContent='Ups';$('#menu').innerHTML='<div class="banner">No pudimos cargar el menú. <button class="btn" id="reint">Reintentar</button></div>';
    $('#reint').onclick=function(){location.reload()};return;
  }
  S.cart=loadCart();
  pintarTienda();
  setInterval(refrescar,60000);
  document.addEventListener('visibilitychange',refrescar);
  var q=new URLSearchParams(location.search),ped=q.get('pedido');
  if(ped&&apiMode()&&/^[a-f0-9]{16}$/.test(ped)){
    try{history.replaceState(null,'',location.pathname+(LOCAL?'?local='+encodeURIComponent(LOCAL):''))}catch(e){}
    store.set('track',JSON.stringify({id:ped,numero:0}));
    abrirSeguimiento(ped,0,true);
  }else revisarPedidoGuardado();
})();
</script>
