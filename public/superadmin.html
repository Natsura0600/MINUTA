<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Minuta · Superadmin</title>
<link rel="icon" href="/brand/minuta-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --surface:#FBF6EE;--raised:#FFFFFF;--mantel:#F4E7D3;--ink:#231C19;--mute:#6E625A;--line:#E6DACA;
  --tinto:#8E1B2C;--ontinto:#fff;--dorado:#E3A33A;--ondorado:#231C19;--sifon:#1F6B5C;--onsifon:#fff;--error:#B54708;--onerror:#fff;
  --carbon:#231C19;--oncarbon:#FBF6EE;--carbon2:#2F2622;
  --sans:"Figtree",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--disp:"DM Serif Display",Georgia,serif;
  --bd:2px solid var(--ink);--sh:4px 4px 0 var(--ink);--sh-sm:2px 2px 0 var(--ink);color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#1B1715;--raised:#26201D;--mantel:#3A2F27;--ink:#F6EEE4;--mute:#B9AC9E;--line:#3D342E;--tinto:#E06A78;--ontinto:#1B1715;--sifon:#6CC3AE;--onsifon:#1B1715;--error:#FF9F6B;--onerror:#1B1715;--carbon:#120F0E;--carbon2:#1E1917;color-scheme:dark}}
:root[data-theme="dark"]{--surface:#1B1715;--raised:#26201D;--mantel:#3A2F27;--ink:#F6EEE4;--mute:#B9AC9E;--line:#3D342E;--tinto:#E06A78;--ontinto:#1B1715;--sifon:#6CC3AE;--onsifon:#1B1715;--error:#FF9F6B;--onerror:#1B1715;--carbon:#120F0E;--carbon2:#1E1917;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--surface)}
body{margin:0;color:var(--ink);font:15px/1.47 var(--sans);overflow-x:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tinto);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}
.mute{color:var(--mute)}
.cap{font:600 11px/16px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
/* Layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--carbon);color:var(--oncarbon);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;border-right:4px solid var(--tinto)}
.side .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.side .logo img{height:30px}
.side .logo small{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#B9AC9E;border:1px solid #6E625A;border-radius:4px;padding:3px 5px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:#E6DACA;font-weight:700;cursor:pointer;text-align:left;position:relative}
.nav:hover{background:var(--carbon2)}
.nav[aria-current=page]{background:var(--oncarbon);color:#231C19}
.nav .n{margin-left:auto;min-width:22px;height:22px;border-radius:999px;background:var(--dorado);color:#231C19;font:600 12px/22px var(--mono);text-align:center;padding:0 6px}
.side .sp{flex:1}
.side .foot{font-size:12px;color:#B9AC9E;padding:8px}
.main{min-width:0;padding:22px clamp(16px,3vw,36px) 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{font:400 clamp(30px,4vw,40px)/1.05 var(--disp);margin:0}
.topbar p{margin:2px 0 0;color:var(--mute)}
/* Piezas */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--tinto);color:var(--ontinto);border:var(--bd);border-radius:10px;padding:10px 16px;font:700 14px/20px var(--sans);cursor:pointer;text-decoration:none;box-shadow:var(--sh-sm);white-space:nowrap}
.btn.ghost{background:var(--raised);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn.ok{background:var(--sifon);color:var(--onsifon)}
.btn.wa{background:#157a42;color:#fff}
.btn.danger{background:var(--raised);color:var(--error);border-color:var(--error);box-shadow:2px 2px 0 var(--error)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
@media (prefers-reduced-motion:no-preference){
  .btn{transition:transform .08s,box-shadow .08s}
  .btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
  .view{animation:in .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes in{from{opacity:0;transform:translateY(10px)}}
  .card.lift{transition:transform .15s,box-shadow .15s}
  .card.lift:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
}
.card{background:var(--raised);border:var(--bd);border-radius:10px;padding:16px;box-shadow:var(--sh-sm);min-width:0}
.card h3{margin:0 0 8px;font:800 16px/22px var(--sans);display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.kpi{position:relative;overflow:hidden}
.kpi b{display:block;font:600 30px/1.1 var(--mono);margin-top:4px}
.kpi small{color:var(--mute)}
.kpi.dark{background:var(--carbon);color:var(--oncarbon)}.kpi.dark .cap,.kpi.dark small{color:#B9AC9E}
.kpi.warn{background:var(--dorado);color:#231C19}.kpi.warn .cap,.kpi.warn small{color:#231C19}
.kpi button{position:absolute;inset:0;opacity:0;cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:4px;font:700 12px/16px var(--sans);padding:3px 9px;border-radius:999px;background:var(--mantel);color:var(--ink);white-space:nowrap}
.b-activo{background:var(--sifon);color:var(--onsifon)}.b-vencido{background:var(--error);color:var(--onerror)}.b-suspendido{background:var(--ink);color:var(--surface)}.b-pronto{background:var(--dorado);color:#231C19}
label.f{display:block;font-weight:600;font-size:14px;margin-top:12px}
label.f:first-child{margin-top:0}
.grid>label.f{margin-top:12px}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border:var(--bd);border-radius:6px;background:var(--surface)}
textarea{resize:vertical}
.help{display:block;color:var(--mute);font-size:13px;font-weight:400;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.err{color:var(--error);font-weight:700;min-height:1.2em;margin:8px 0 0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1 1 240px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:7px 13px;border-radius:999px;border:1.5px solid var(--ink);background:var(--raised);font:700 13px/18px var(--sans);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.chips button .c{font-family:var(--mono);opacity:.7;margin-left:4px}
.loc{cursor:pointer;display:grid;gap:8px;border-left-width:8px}
.loc.e-activo{border-left-color:var(--sifon)}.loc.e-vencido{border-left-color:var(--error)}.loc.e-suspendido{border-left-color:var(--mute)}.loc.e-pronto{border-left-color:var(--dorado)}
.loc .t{display:flex;align-items:center;gap:8px;justify-content:space-between}
.loc .t b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .u{font:500 13px var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .m{display:flex;gap:14px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.loc .m b{color:var(--ink);font-family:var(--mono)}
.todo{display:grid;gap:8px}
.todo .it{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);flex-wrap:wrap}
.todo .it b{display:block}
.empty{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--mute)}
.pw{font:600 18px var(--mono);background:var(--mantel);border:2px dashed var(--ink);border-radius:8px;padding:12px;word-break:break-all;user-select:all;margin-top:6px}
.cred{background:var(--mantel);border:var(--bd);border-radius:10px;padding:14px;margin-top:14px}
.cred p{margin:4px 0}
.hist{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.hist td,.hist th{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:left}
.hist th{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.hist td.n{font-family:var(--mono);text-align:right}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.imgs .im{border:var(--bd);border-radius:10px;overflow:hidden;background:var(--raised)}
.imgs .im img{display:block;width:100%;height:110px;object-fit:cover;border-bottom:var(--bd)}
.imgs .im div{padding:8px;display:grid;gap:6px}
.imgs .im input{margin:0;padding:6px 8px;font-size:13px}
.hero-prev{width:100%;max-width:420px;height:170px;object-fit:cover;border:var(--bd);border-radius:10px;display:block;background:var(--mantel)}
.ph0{width:100%;max-width:420px;height:170px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mute)}
/* Drawer */
dialog.drawer{margin:0 0 0 auto;height:100%;max-height:100%;width:min(560px,100%);border:0;border-left:var(--bd);padding:0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(27,23,21,.55)}
@media (prefers-reduced-motion:no-preference){dialog.drawer[open]{animation:slide .28s cubic-bezier(.2,.8,.2,1)}@keyframes slide{from{transform:translateX(40px);opacity:0}}dialog.modal[open]{animation:pop .22s}@keyframes pop{from{transform:scale(.97);opacity:0}}}
.dh{position:sticky;top:0;z-index:2;background:var(--carbon);color:var(--oncarbon);padding:16px 18px;display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:4px solid var(--tinto)}
.dh h2{margin:0;font:400 26px/1.1 var(--disp)}
.dh small{display:block;font:500 12px var(--mono);color:#B9AC9E}
.x{width:38px;height:38px;border-radius:50%;border:2px solid var(--oncarbon);background:transparent;color:var(--oncarbon);cursor:pointer;display:grid;place-items:center;flex:none}
.db{padding:16px 18px 40px;display:grid;gap:14px}
dialog.modal{border:var(--bd);border-radius:24px;padding:0;width:min(440px,calc(100% - 24px));background:var(--raised);color:var(--ink);box-shadow:var(--sh)}
dialog.modal .mb{padding:20px}
dialog.modal h3{margin:0 0 8px;font:400 26px/1.1 var(--disp)}
.toast{position:fixed;right:18px;bottom:18px;z-index:60;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 36px);display:flex;gap:10px;align-items:center}
.toast.ok::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sifon)}
.toast.bad::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--error)}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .25s}@keyframes tin{from{opacity:0;transform:translateY(10px)}}}
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--mantel) 50%,var(--line) 75%);background-size:200% 100%;border-radius:10px;height:110px}
@media (prefers-reduced-motion:no-preference){.sk{animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}}
/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background-color:#FBF6EE;background-image:linear-gradient(90deg,rgba(142,27,44,.4) 50%,transparent 0),linear-gradient(rgba(142,27,44,.4) 50%,transparent 0);background-size:32px 32px}
.login .card{width:min(400px,100%);padding:26px;border-radius:24px;box-shadow:var(--sh);background:#fff;color:#231C19}
.login h1{font:400 32px/1.1 var(--disp);margin:16px 0 4px}
.login input{background:#FBF6EE!important;color:#231C19}
.steps3{display:flex;gap:6px;margin:0 0 14px}
.steps3 span{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps3 span.on{background:var(--tinto)}
.mini-help{background:var(--mantel);border:1.5px dashed var(--ink);border-radius:10px;padding:12px 14px;font-size:14px}
.mtop{display:none}
.ts{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  input,select,textarea{font-size:16px!important}
  .mtop{display:flex;position:sticky;top:0;z-index:20;align-items:center;justify-content:space-between;gap:10px;background:var(--carbon);color:var(--oncarbon);padding:10px 16px;border-bottom:4px solid var(--tinto);margin:0 calc(-1*clamp(16px,3vw,36px)) 16px}
  .mtop img{height:24px}
  .mtop button{display:inline-flex;align-items:center;gap:6px;background:transparent;border:2px solid var(--oncarbon);color:var(--oncarbon);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px;cursor:pointer}
  .main{padding-top:0;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:30;flex-direction:row;gap:2px;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:4px solid var(--tinto)}
  .side .logo,.side .sp,.side .foot,#salir{display:none}
  .nav{flex:1 1 0;min-width:0;flex-direction:column;gap:2px;padding:7px 2px;font-size:11px;text-align:center;justify-content:center}
  .nav .ico{width:22px;height:22px}
  .nav .t{display:none}.nav .ts{display:block;white-space:nowrap}
  .nav .n{position:absolute;top:2px;left:calc(50% + 6px);margin:0;min-width:18px;height:18px;line-height:18px;font-size:11px;padding:0 5px}
  .topbar{margin-bottom:14px;flex-wrap:nowrap;align-items:flex-start}
  #refresh{font-size:0;gap:0;padding:8px}#refresh .ico{width:20px;height:20px}
  .topbar h1{font-size:30px}
  .topbar p{font-size:14px}
  .kpi b{font-size:22px;white-space:nowrap}
  .kpi{padding:12px}
  .todo .it .row{width:100%}
  .todo .it .row .btn{flex:1}
  .toast{left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:none}
  dialog.drawer{width:100%;max-width:100%;border-left:0}
  .dh h2{font-size:22px}
  .db{padding:14px 14px calc(40px + env(safe-area-inset-bottom,0px))}
  .hist td.n{white-space:nowrap}
  .card{padding:14px}
  .acts .btn{flex:1 1 auto}
  dialog.modal{margin:auto 0 0;width:100%;max-width:100%;border-radius:24px 24px 0 0;border-bottom:0}
  dialog.modal .mb{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%}
  .chips button{flex:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></symbol>
<symbol id="i-store" viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16"/><path d="M9 20v-6h6v6"/></symbol>
<symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-page" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-wa" viewBox="0 0 24 24"><path d="M4 20l1.3-3.8A8 8 0 1 1 8 19z"/></symbol>
<symbol id="i-cash" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></symbol>
<symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M10 4H4v16h6M14 8l4 4-4 4M18 12H9"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
</svg>

<!-- Login -->
<div class="login" id="login" role="main">
  <div class="card">
    <img src="/brand/minuta-lockup.svg" alt="Minuta" style="height:32px">
    <h1>Hola, jefe.</h1>
    <p class="mute" style="margin:0 0 16px;color:#6E625A">Tu panel para manejar todos los locales.</p>
    <label class="f" for="sp">Contraseña de administrador<input id="sp" type="password" autocomplete="current-password"></label>
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn" id="lgo" style="width:100%;margin-top:6px">Entrar</button>
  </div>
</div>

<!-- App -->
<div class="app" id="app" hidden>
  <aside class="side" aria-label="Secciones">
    <div class="logo"><img src="/brand/minuta-wordmark-reverse.svg" alt="Minuta"><small>Admin</small></div>
    <button class="nav" data-v="resumen" aria-current="page"><svg class="ico"><use href="#i-home"/></svg><span class="t">Resumen</span><span class="ts">Resumen</span></button>
    <button class="nav" data-v="locales"><svg class="ico"><use href="#i-store"/></svg><span class="t">Locales</span><span class="ts">Locales</span><span class="n" id="nLoc" hidden></span></button>
    <button class="nav" data-v="solicitudes"><svg class="ico"><use href="#i-inbox"/></svg><span class="t">Solicitudes</span><span class="ts">Bandeja</span><span class="n" id="nSol" hidden></span></button>
    <button class="nav" data-v="nuevo"><svg class="ico"><use href="#i-plus"/></svg><span class="t">Nuevo local</span><span class="ts">Nuevo</span></button>
    <button class="nav" data-v="pagina"><svg class="ico"><use href="#i-page"/></svg><span class="t">Página de inicio</span><span class="ts">Página</span></button>
    <button class="nav" data-v="registro"><svg class="ico"><use href="#i-page"/></svg><span class="t">Registro</span><span class="ts">Registro</span></button>
    <div class="sp"></div>
    <button class="nav" id="salir"><svg class="ico"><use href="#i-out"/></svg><span class="t">Salir</span></button>
    <div class="foot">Soporte que ven los locales:<br><span class="mono">+54 11 5249-5689</span></div>
  </aside>
  <main class="main">
    <div class="mtop"><img src="/brand/minuta-wordmark-reverse.svg" alt="Minuta"><button id="salir2"><svg class="ico" style="width:16px;height:16px"><use href="#i-out"/></svg>Salir</button></div>
    <div class="topbar"><div><h1 id="vTit">Resumen</h1><p id="vSub"></p></div><div class="row" id="vActs"></div></div>
    <div id="view"></div>
  </main>
</div>

<dialog class="drawer" id="dLoc"></dialog>
<dialog class="modal" id="dConf"><div class="mb"><h3 id="cTit"></h3><p id="cTxt" class="mute"></p><div id="cExtra"></div><p class="err" id="cErr"></p><div class="acts"><button class="btn ghost" id="cNo">Cancelar</button><button class="btn" id="cSi">Confirmar</button></div></div></dialog>

<script src="/superadmin.js"></script>
</body>
</html>
